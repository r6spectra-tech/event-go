<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行揪團</title>
<script>
/* 舊網址相容：detail.html 已併入 index.html，轉到 index.html?page=detail（保留原本的參數） */
(function(){
  var params = new URLSearchParams(location.search);
  var state = params.get("liff.state");
  if (state && state.charAt(0) === "?") {
    params.delete("liff.state");
    new URLSearchParams(state.slice(1)).forEach(function(v, k){ params.set(k, v); });
  }
  params.set("page", "detail");
  location.replace("index.html?" + params.toString() + location.hash);
})();
</script>
</head>
<body></body>
</html>
