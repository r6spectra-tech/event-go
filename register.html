<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>支付與報到調查登記</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #00B900; /* LINE Green */
        --primary-dark: #009900;
        --teal: #14b8a6;
        --teal-hover: #0d9488;
        --bg: #f6f7f9;
        --panel-bg: #ffffff;
        --text-main: #333333;
        --text-secondary: #777777;
        --border: #e0e0e0;
        --stamp: #ff5722; 
        --radius-md: 12px;
        --radius-sm: 8px;
        --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        margin: 0;
        padding: 0;
        line-height: 1.5;
        padding-bottom: 80px;
    }

    /* Topbar 美化 */
    .topbar {
        background-color: var(--panel-bg);
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .topbar-compact { padding: 12px 20px; }

    .eyebrow {
        font-size: 0.75rem;
        color: var(--primary);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: block;
        margin-bottom: 2px;
    }

    h1 { margin: 0; font-size: 1.25rem !important; font-weight: 800; }

    /* 主要內容區域 */
    .admin-wrap {
        max-width: 600px;
        margin: 20px auto;
        padding: 0 16px;
    }

    /* 通用 Panel 卡片 */
    .panel {
        background-color: var(--panel-bg);
        border-radius: var(--radius-md);
        padding: 24px;
        box-shadow: var(--shadow);
        margin-bottom: 20px;
        border: 1px solid rgba(0,0,0,0.02);
    }

    .panel-title {
        font-size: 1.1rem;
        font-weight: 700;
        margin: 0 0 12px 0;
        color: var(--text-main);
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
    }

    .text-small { font-size: 0.85rem; color: var(--text-secondary); }
    
    /* 活動標頭資訊 */
    .activity-header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        padding: 20px;
        border-radius: var(--radius-md);
        margin-bottom: 20px;
    }
    .activity-header .eyebrow { color: rgba(255,255,255,0.8); }
    .activity-header .panel-title { border-bottom: 1px solid rgba(255,255,255,0.3); color: white; }

    /* 表單欄位 */
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }

    .field-label {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-main);
    }

    input[type="text"],
    input[type="number"],
    input[type="time"],
    select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-family: inherit;
        font-size: 1rem;
        background-color: #fff;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(0, 185, 0, 0.1);
    }

    .copy-field {
        display: flex;
        align-items: center;
        gap: 8px;
        background-color: #f9f9f9;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 4px 4px 4px 16px;
    }

    .copy-text {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 1rem;
        color: #333;
        flex-grow: 1;
        user-select: all;
    }

    /* 按鈕樣式 */
    .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        padding: 12px 24px;
        border-radius: var(--radius-sm);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        text-decoration: none;
        font-family: inherit;
        line-height: 1.4;
    }

    .btn-block { display: flex; width: 100%; }

    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-dark); }
    .btn-primary:disabled { background-color: #ccc; cursor: not-allowed; }

    .btn-ghost { background-color: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-ghost:hover { background-color: #f5f5f5; }

    .btn-teal { background-color: var(--teal); color: white; }
    .btn-teal:hover { background-color: var(--teal-hover); }

    .notice-box {
        background-color: #fff3e0;
        border-left: 4px solid var(--stamp);
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        color: #827717;
        font-size: 0.85rem;
        margin-top: 12px;
    }

    /* 歡迎載入動畫樣式 */
    .welcome-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        text-align: center;
        min-height: 50vh;
    }
    .welcome-logo-icon {
        font-size: 3rem;
        margin-bottom: 16px;
        animation: bounce 1.5s infinite ease-in-out;
    }
    .welcome-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }
    .welcome-subtitle { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 24px; }
    .spinner-pulse {
        width: 40px; height: 40px;
        border: 3px solid #e0e0e0;
        border-top: 3px solid var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .empty {
        text-align: center; color: var(--text-secondary); padding: 40px 20px;
        font-size: 0.9rem; background: white; border-radius: var(--radius-md); border: 1px solid var(--border);
    }

    /* 管理員列表與區段 */
    .waitlist-row {
        background: #fff; border-bottom: 1px solid #eee; padding: 12px 16px;
        display: flex; justify-content: space-between; align-items: center;
    }
    .waitlist-row:last-child { border-bottom: none; }
    .waitlist-row .name { font-weight: 700; font-size: 0.95rem; }
    .waitlist-row .meta { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }

    .waitlist-activity-section {
        margin-top: 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
    }
    .waitlist-activity-title {
        background: #f9f9f9; padding: 10px 16px; font-weight: 700; font-size: 0.9rem; border-bottom: 1px solid var(--border); margin: 0;
    }
    .success-icon { font-size: 3.5rem; margin-bottom: 12px; display: block; text-align: center; }
    .mt-2 { margin-top: 8px; }
    .mt-4 { margin-top: 16px; }
</style>
</head>
<body>

<div class="topbar topbar-compact">
  <div>
    <span class="eyebrow">Activity System</span>
    <h1 id="pageTitle" style="font-size:1.05rem;">載入中...</h1>
  </div>
</div>

<div class="admin-wrap" id="app">
  <div class="welcome-loader">
    <div class="welcome-logo-icon">🚌</div>
    <div class="welcome-title">活動管理小幫手</div>
    <div class="welcome-subtitle">正在安全載入頁面，請稍候...</div>
    <div class="spinner-pulse"></div>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="assets/main.js?v=20260728-17"></script>
<script>
const params = getRealQueryParams();
const activityId = params.get("activityId");
const view = params.get("view") || "payInfo";
let activity = null;
let profile = null;

function methodLabel(m){
  return { transfer: "轉帳匯款", linepay: "LINE PAY", cash: "現金" }[m] || m;
}

// checkinTypeLabel() 用 assets/main.js 裡定義的那份，這裡不再重複宣告——
// 之前這裡跟 main.js 各自定義了一份同名函式，因為 main.js 先載入、register.html
// 的行內 script 後載入，全域作用域下後宣告的會蓋掉前面的，導致 main.js 裡建立 Flex
// 訊息用的 checkinTypeLabel() 也被這裡的舊版文字覆蓋、改了主檔案文字卻沒生效。

function copyText(text){
  navigator.clipboard?.writeText(text).then(
    () => alert("已複製：" + text),
    () => prompt("請手動複製：", text)
  );
}

/* ---- view=payInfo：支付說明（已優化二選一視覺區隔） ---- */
function renderPayInfo(){
  const app = document.getElementById("app");
  
  const bank = activity.bankInfo
    ? `<div class="field mt-2">
         <div class="copy-field">
           <span class="copy-text">${activity.bankInfo}</span>
           <button type="button" class="btn btn-ghost" id="copyBankBtn" style="padding: 8px 12px;">📋 複製</button>
         </div>
         <div class="notice-box">
           ⭐ 匯款後請記得點下方按鈕進行「已支付登記」並填寫帳號末四碼。
         </div>
       </div>`
    : `<div class="text-small" style="color:#999;">主辦人尚未設定匯款帳號資訊。</div>`;

  const linepay = activity.organizerLineUrl
    ? `<div class="field">
         <a class="btn btn-teal btn-block" href="${activity.organizerLineUrl}" target="_blank" rel="noopener">
           <span style="font-weight:900; margin-right:8px;">LINE Pay</span> 前往轉帳
         </a>
         <p class="text-small mt-2" style="text-align:center;">請先加主辦人 LINE 好友，再進行轉帳</p>
       </div>`
    : `<p class="text-small" style="color:#999;">主辦人尚未設定 LINE Pay 連結。</p>`;

  app.innerHTML = `
    <div class="activity-header">
        <span class="eyebrow">${activity.date}</span>
        <h2 class="panel-title" style="border:none; padding:0; margin-top:4px;">${activity.title}</h2>
        <p style="font-size:1.2rem; font-weight:900; margin:10px 0 0 0;">應付費用：NT$ ${activity.price || "-"}</p>
    </div>

    <div class="panel">
      <h3 class="panel-title" style="display:flex; align-items:center; gap:6px;">
        <span>💳</span> 請選擇以下<strong>其中一種方式</strong>完成付款
      </h3>
      <p class="text-small" style="color:var(--text-secondary); margin-bottom: 16px;">完成付款後，別忘了點擊下方按鈕回報登記。</p>

      <!-- 方式一：轉帳匯款 -->
      <div style="border: 2px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 14px; background: #fafafa;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-weight: 700; font-size: 0.95rem;">選項 A：轉帳匯款</span>
          <span style="font-size: 0.75rem; background: #e0e0e0; padding: 2px 8px; border-radius: 10px;">ATM / 網銀</span>
        </div>
        <div class="text-small" style="margin-bottom: 4px;">匯款銀行與帳號：</div>
        ${bank}
      </div>

      <!-- 分隔提示 -->
      <div style="text-align: center; margin: 10px 0; position: relative;">
        <span style="background: white; padding: 0 12px; font-size: 0.8rem; color: #999; position: relative; z-index: 1;">或者</span>
        <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border); z-index: 0;"></div>
      </div>

      <!-- 方式二：LINE Pay -->
      <div style="border: 2px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-top: 14px; background: #fafafa;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <span style="font-weight: 700; font-size: 0.95rem;">選項 B：LINE Pay 轉帳</span>
          <span style="font-size: 0.75rem; background: #e0f2f1; color: var(--teal); padding: 2px 8px; border-radius: 10px;">線上支付</span>
        </div>
        ${linepay}
      </div>
    </div>

    <div style="margin-top: 20px;">
      <a class="btn btn-primary btn-block" id="goFormBtn" style="margin-bottom: 10px; padding: 14px;">✏️ 我已付款，前往登記帳號末四碼</a>
      <a class="btn btn-ghost btn-block" id="goDetailBtn">📄 返回活動詳情</a>
    </div>
  `;
  if(activity.bankInfo){
    document.getElementById("copyBankBtn").addEventListener("click", ()=> copyText(activity.bankInfo));
  }
  document.getElementById("goFormBtn").addEventListener("click", ()=>{
    location.href = `register.html?activityId=${encodeURIComponent(activityId)}&view=payForm`;
  });
  document.getElementById("goDetailBtn").addEventListener("click", ()=>{
    location.href = `detail.html?id=${encodeURIComponent(activityId)}`;
  });
}

/* ---- view=payForm：已支付登記表單 ---- */
async function renderPayForm(){
  const app = document.getElementById("app");
  let existing = null;
  try{ existing = await apiGetMyPayment(activityId, profile.userId); }catch(e){ console.warn(e); }

  app.innerHTML = `
    <div class="activity-header">
        <span class="eyebrow">Payment Form</span>
        <h2 class="panel-title" style="border:none; padding:0; margin-top:4px;">已支付登記</h2>
    </div>

    <div class="panel">
      <div class="text-small" style="margin-bottom: 16px;">活動：${activity.date}｜${activity.title}</div>

      <div class="field">
        <label class="field-label">請選擇支付方式</label>
        <select id="method">
          <option value="transfer">轉帳匯款</option>
          <option value="linepay">LINE PAY</option>
          <option value="cash">現金</option>
        </select>
      </div>
      <div class="field" id="last4Field">
        <label class="field-label">轉帳（匯款）銀行帳號末 4 碼</label>
        <input type="text" id="last4" maxlength="4" inputmode="numeric" placeholder="例如 1234">
      </div>
      <div class="field">
        <label class="field-label">匯款人姓名</label>
        <input type="text" id="payerName" value="${profile.displayName || ""}">
      </div>

      <button class="btn btn-primary btn-block mt-4" id="submitBtn">送出登記</button>
      <p id="msg" class="text-small mt-2" style="text-align:center; color:var(--stamp);"></p>
    </div>
  `;

  const methodSel = document.getElementById("method");
  const last4Field = document.getElementById("last4Field");
  function syncLast4Visibility(){
    last4Field.style.display = methodSel.value === "transfer" ? "block" : "none";
  }
  methodSel.addEventListener("change", syncLast4Visibility);
  syncLast4Visibility();

  if(existing){
    methodSel.value = existing.method || "transfer";
    document.getElementById("last4").value = existing.last4 || "";
    document.getElementById("payerName").value = existing.displayName || profile.displayName || "";
    syncLast4Visibility();
    document.getElementById("msg").textContent = `💡 您於 (${existing.updatedAt}) 登記過，重新送出將會覆蓋更新。`;
  }

  document.getElementById("submitBtn").addEventListener("click", async ()=>{
    const method = methodSel.value;
    const last4 = document.getElementById("last4").value.trim();
    const payerName = document.getElementById("payerName").value.trim();
    if(method === "transfer" && !/^\d{4}$/.test(last4)){
      alert("請輸入正確的銀行帳號末 4 碼（4 位數字）");
      return;
    }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "送出中…";
    try{
      await apiSubmitPayment(activityId, profile.userId, payerName, method, method === "transfer" ? last4 : "");
      app.innerHTML = `
        <div class="panel" style="text-align:center; padding: 40px 24px;">
          <span class="success-icon">✅</span>
          <h3 style="margin: 0 0 8px 0; font-size: 1.25rem;">登記完成</h3>
          <p class="text-small" style="margin-bottom: 24px;">${activity.title}｜${methodLabel(method)}</p>
          <a class="btn btn-ghost btn-block" href="detail.html?id=${encodeURIComponent(activityId)}">返回活動詳情</a>
        </div>
      `;
    }catch(e){
      alert("送出失敗：" + e.message);
      btn.disabled = false;
      btn.textContent = "送出登記";
    }
  });
}

/* ---- view=payAdmin：管理端，發通知＋看名單 ---- */
async function renderPayAdmin(){
  const app = document.getElementById("app");
  const { status } = await checkIsManager(profile.userId);
  if(status !== "approved"){
    app.innerHTML = `<div class="empty">🔒 此頁面僅限核准管理者使用</div>`;
    return;
  }
  app.innerHTML = `
    <div class="panel">
      <h3 class="panel-title">🛡️ 匯款通知／支付登記管理</h3>
      <div class="text-small" style="margin-bottom: 12px;">${activity.date}｜${activity.title}｜費用 NT$ ${activity.price || "-"}</div>
      ${activity.bankInfo ? "" : `<div class="notice-box">⚠️ 這個活動還沒設定匯款帳號（請至「編輯活動」補上），通知內將只會顯示 LINE Pay 選項。</div>`}
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
        <button class="btn btn-primary btn-block" id="sendBtn">📣 發送匯款通知到群組</button>
        <button class="btn btn-ghost btn-block" id="refreshBtn">🔄 重新整理名單</button>
      </div>
      <div id="list" style="margin-top:16px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow:hidden;"></div>
    </div>
  `;
  document.getElementById("sendBtn").addEventListener("click", ()=> sharePaymentNotice(activity));
  document.getElementById("refreshBtn").addEventListener("click", loadPaymentList);
  loadPaymentList();
}

async function loadPaymentList(){
  const listEl = document.getElementById("list");
  listEl.innerHTML = `<div class="welcome-loader" style="padding: 20px;"><div class="spinner-pulse"></div></div>`;
  try{
    const list = await apiGetPayments(profile.userId, activityId);
    if(!list.length){
      listEl.innerHTML = `<div class="empty" style="border:none;">目前還沒有人登記支付</div>`;
      return;
    }
    listEl.innerHTML = `<div style="background: #f9f9f9; padding: 8px 16px; font-size: 0.8rem; color: var(--text-secondary); border-bottom: 1px solid var(--border);">共 ${list.length} 人已登記</div>` + list.map(p => `
      <div class="waitlist-row">
        <div>
          <div class="name">${p.displayName || "(未提供名稱)"}</div>
          <div class="meta">${methodLabel(p.method)}${p.last4 ? "／末 4 碼 <span style='font-family:monospace; font-weight:bold; color:#333;'>" + p.last4 + "</span>" : ""}｜${p.updatedAt}</div>
        </div>
      </div>
    `).join("");
  }catch(e){
    listEl.innerHTML = `<div class="empty" style="border:none; color:var(--stamp);">讀取失敗：${e.message}</div>`;
  }
}

/* ---- 報到時間預設值 ---- */
function fmtHM(d){ return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

// 把 "HH:MM" 字串轉成「今天」的 Date 物件，純粹拿來做時間運算用（實際送出時後端會自己
// 判斷要不要換算成明天，這裡只是給快速按鈕計算用的暫時物件）
function hmToDate(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}

// 下一個半點或整點，「一定」往後推進（就算剛好卡在整點/半點上，也會跳到下一個，
// 不會原地不動——這樣同一顆按鈕才能連續按、每次都有效果）
function roundUpToNextHalfHour(d){
  const r = new Date(d);
  r.setSeconds(0,0);
  if(r.getMinutes() < 30) r.setMinutes(30);
  else { r.setMinutes(0); r.setHours(r.getHours()+1); }
  return r;
}
function roundUpToNextHour(d){
  const r = new Date(d);
  r.setSeconds(0,0);
  r.setMinutes(0);
  r.setHours(r.getHours()+1);
  return r;
}
// 留給 nextHalfOrHourDate 開頁面時算「預設值」用，這個是相對「現在」算，跟上面兩個
// 「作用在目前欄位值」的版本不同用途
function nextHalfOrHourDate(){ return roundUpToNextHalfHour(new Date()); }

function defaultCheckinWindow(){
  return { startStr: fmtHM(nextHalfOrHourDate()) };
}

/* ---- view=checkinAdmin：管理端建立報到調查＋分享 ---- */
async function renderCheckinAdmin(){
  const app = document.getElementById("app");
  const { status } = await checkIsManager(profile.userId);
  if(status !== "approved"){
    app.innerHTML = `<div class="empty">🔒 此頁面僅限核准管理者使用</div>`;
    return;
  }
  const def = defaultCheckinWindow();
  app.innerHTML = `
    <div class="panel">
      <h3 class="panel-title">🚌 建立上車（出發）報到調查</h3>
      <div class="text-small" style="margin-bottom: 16px;">${activity.date}｜${activity.title}</div>

      <div class="field">
        <label class="field-label">選擇報到調查別</label>
        <select id="checkinType">
          <option value="departure">出發報到調查</option>
          <option value="boarding">上車報到調查</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">選擇遊覽車數量</label>
        <select id="busCount">${Array.from({length:9},(_,i)=>`<option value="${i+1}">${i+1} 台</option>`).join("")}</select>
      </div>
      <div class="field">
        <label class="field-label">遊覽車編號方式</label>
        <select id="busLabelStyle">
          <option value="ABC">ABC</option>
          <option value="123">123</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">報到調查開始時間</label>
        <input id="startTime" type="time" value="${def.startStr}">
        <div style="display:flex; gap:6px; margin-top:8px;">
          <button type="button" class="btn btn-ghost quickTimeBtn" data-mode="plus" data-val="30" style="flex:1; padding:8px 4px; font-size:0.82rem;">+30分</button>
          <button type="button" class="btn btn-ghost quickTimeBtn" data-mode="plus" data-val="60" style="flex:1; padding:8px 4px; font-size:0.82rem;">+60分</button>
          <button type="button" class="btn btn-ghost quickTimeBtn" data-mode="plus" data-val="120" style="flex:1; padding:8px 4px; font-size:0.82rem;">+120分</button>
        </div>
        <div style="display:flex; gap:6px; margin-top:6px;">
          <button type="button" class="btn btn-ghost quickTimeBtn" data-mode="halfhour" style="flex:1; padding:8px 4px; font-size:0.82rem;">下個半點</button>
          <button type="button" class="btn btn-ghost quickTimeBtn" data-mode="hour" style="flex:1; padding:8px 4px; font-size:0.82rem;">下個整點</button>
          <button type="button" class="btn btn-ghost quickTimeBtn" data-mode="now" style="flex:1; padding:8px 4px; font-size:0.82rem;">目前時間</button>
        </div>
        <p class="text-small" style="margin-top:6px;">💡 上排 3 個是累加的（可以連按疊加）；下排「下個半點／下個整點」是把目前欄位裡的時間無條件進位，「目前時間」會直接重置成現在，清掉之前疊加的結果。</p>
      </div>
      <div class="field">
        <label class="field-label">報到調查開始前 N 分鐘可以報名</label>
        <input id="earlyMinutes" type="number" min="0" max="60" value="5">
      </div>
      <div class="field">
        <label class="field-label">報到調查開始後 N 分鐘結束報名</label>
        <input id="afterMinutes" type="number" min="1" max="180" value="10">
      </div>
      <p class="text-small" id="windowPreview" style="margin-top:-8px;"></p>
      <div class="field">
        <label class="field-label">每台車依序錯開幾分鐘開放報名</label>
        <input id="staggerMinutes" type="number" min="0" max="30" value="2">
      </div>

      <button class="btn btn-primary btn-block mt-4" id="createBtn">建立並分享</button>
      <div id="result" style="margin-top:16px;"></div>
    </div>
  `;

  function updatePreview(){
    const t = document.getElementById("startTime").value;
    const early = Number(document.getElementById("earlyMinutes").value) || 0;
    const after = Number(document.getElementById("afterMinutes").value) || 0;
    if(!t){ document.getElementById("windowPreview").textContent = ""; return; }
    const start = hmToDate(t);
    const openFrom = new Date(start.getTime() - early*60000);
    const closeAt = new Date(start.getTime() + after*60000);
    document.getElementById("windowPreview").textContent =
      `📋 實際可報名區間：${fmtHM(openFrom)} ~ ${fmtHM(closeAt)}（每台車依序錯開的話，各車開放時間還會再往後推）`;
  }
  ["startTime","earlyMinutes","afterMinutes"].forEach(id=>{
    document.getElementById(id).addEventListener("input", updatePreview);
  });
  updatePreview();

  document.querySelectorAll(".quickTimeBtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const mode = btn.dataset.mode;
      const field = document.getElementById("startTime");
      let d;
      if(mode === "plus"){
        // 累加：作用在「目前欄位裡的值」，不是作用在「現在」，可以連續按疊加
        const current = field.value ? hmToDate(field.value) : new Date();
        d = new Date(current.getTime() + Number(btn.dataset.val)*60000);
      }else if(mode === "halfhour"){
        // 不累加：對「目前欄位裡的值」無條件進位到下個半點
        const current = field.value ? hmToDate(field.value) : new Date();
        d = roundUpToNextHalfHour(current);
      }else if(mode === "hour"){
        const current = field.value ? hmToDate(field.value) : new Date();
        d = roundUpToNextHour(current);
      }else{
        // 目前時間：直接重置成現在，清掉之前疊加的結果
        d = new Date();
      }
      d.setSeconds(0,0);
      field.value = fmtHM(d);
      updatePreview();
    });
  });

  document.getElementById("createBtn").addEventListener("click", async ()=>{
    const btn = document.getElementById("createBtn");
    btn.disabled = true;
    btn.textContent = "建立中…";
    const checkinType = document.getElementById("checkinType").value;
    const busCount = document.getElementById("busCount").value;
    const busLabelStyle = document.getElementById("busLabelStyle").value;
    const startTime = document.getElementById("startTime").value;
    const earlyMinutes = document.getElementById("earlyMinutes").value;
    const afterMinutes = document.getElementById("afterMinutes").value;
    const staggerMinutes = document.getElementById("staggerMinutes").value;
    try{
      const res = await apiCreateCheckinRound(activityId, checkinType, busCount, busLabelStyle, startTime, staggerMinutes, earlyMinutes, afterMinutes, profile.userId);
      const round = { roundNumber: res.roundNumber, busLabels: res.busLabels, checkinType, startTime: res.startTime, endTime: res.endTime, staggerMinutes: Number(staggerMinutes) || 0, earlyMinutes: Number(earlyMinutes) || 0 };
      const timeConfirm = res.startTime ? `（實際時間：${fmtCheckinDateTime(res.startTime)} ~ ${fmtCheckinDateTime(res.endTime)}）` : "";
      document.getElementById("result").innerHTML = `
        <div class="notice-box" style="background:#e0f2f1; color:var(--teal); border-left-color:var(--teal);">✅ 已建立第 ${res.roundNumber} 次報到調查（${res.busLabels.join("、")} 車）${timeConfirm}</div>
        <button class="btn btn-teal btn-block mt-2" id="shareRoundBtn">📣 分享報到調查訊息到群組</button>
        <a class="btn btn-ghost btn-block mt-2" href="register.html?activityId=${encodeURIComponent(activityId)}&view=checkinStatus&round=${res.roundNumber}">查看登記情形 →</a>
      `;
      document.getElementById("shareRoundBtn").addEventListener("click", ()=> shareCheckinRound(activity, round));
    }catch(e){
      alert("建立失敗：" + e.message);
    }finally{
      btn.disabled = false;
      btn.textContent = "建立並分享";
    }
  });
}

/* ---- view=checkin：參加者按「上車登記」 ---- */
function pendingCheckinKey(activityId, roundNumber, userId){
  return `checkinPending:${activityId}:${roundNumber}:${userId}`;
}

function submitCheckinWithRetry(aid, roundNumber, busLabel, userId, displayName){
  const key = pendingCheckinKey(aid, roundNumber, userId);
  const payload = { activityId: aid, roundNumber, busLabel, userId, displayName };
  try{ localStorage.setItem(key, JSON.stringify(payload)); }catch(e){}
  attemptCheckinSend(payload, key, 0);
}

async function attemptCheckinSend(payload, key, attempt){
  try{
    await apiSubmitCheckin(payload);
    try{ localStorage.removeItem(key); }catch(e){}
  }catch(e){
    if(attempt < 5){
      setTimeout(()=> attemptCheckinSend(payload, key, attempt+1), 5000);
    }
  }
}

function flushPendingCheckins(){
  try{
    Object.keys(localStorage).filter(k => k.startsWith("checkinPending:")).forEach(k=>{
      try{
        attemptCheckinSend(JSON.parse(localStorage.getItem(k)), k, 0);
      }catch(e){}
    });
  }catch(e){}
}

async function renderCheckin(){
  const app = document.getElementById("app");
  const roundNumber = params.get("round");
  const bus = params.get("bus") || "";
  if(!roundNumber){
    app.innerHTML = `<div class="empty">❌ 缺少報到調查次別參數</div>`;
    return;
  }
  let round = null;
  try{ round = await apiGetCheckinRound(activityId, roundNumber); }catch(e){}

  // 先查這個人「不分車次」在這次報到裡是不是已經登記過了，登記過的話不管打開哪台車的
  // 連結，都直接顯示已完成狀態，不會再讓他重複按（也不會被時間鎖住而看起來卡住）
  let existing = null;
  try{ existing = await apiGetMyCheckin(activityId, roundNumber, profile.userId); }catch(e){}

  if(existing){
    app.innerHTML = `
      <div class="panel" style="text-align:center; padding: 32px 20px;">
        <div class="text-small" style="margin-bottom: 6px;">${activity.date}｜${activity.title}</div>
        <div style="font-size:0.9rem; color:var(--text-secondary); margin-bottom: 16px;">第 ${roundNumber} 次${round ? "｜" + checkinTypeLabel(round.checkinType) : ""}</div>
        <span class="success-icon">✅</span>
        <p style="font-weight:700; font-size:1.1rem;">已完成報到調查登記（${existing.busLabel || bus} 車）</p>
        <p class="text-small" style="margin-top:6px;">登記時間：${existing.createdAt}</p>
      </div>
    `;
    return;
  }

  // 用 ISO 日期時間直接比較（round.startTime 已經是建立當下換算好的完整日期時間，
  // 不再用「今天」去猜，修正之前「設定明天早上的時間，但今天比對就顯示已開放」的 bug）
  let busStartDate = null;
  if(round && round.startTime){
    const busIndex = (round.busLabels || []).indexOf(bus);
    const stagger = Number(round.staggerMinutes) || 0;
    busStartDate = new Date(round.startTime);
    if(busIndex > 0 && stagger > 0){
      busStartDate = new Date(busStartDate.getTime() + busIndex * stagger * 60000);
    }
  }
  // 實際可以按的時間點是「這台車的開放時間」再往前推 earlyMinutes 分鐘（早鳥寬限期）
  const early = round ? (Number(round.earlyMinutes) || 0) : 0;
  const actualOpenDate = busStartDate ? new Date(busStartDate.getTime() - early*60000) : null;
  const notYetOpen = actualOpenDate && new Date() < actualOpenDate;
  const openTimeText = actualOpenDate ? fmtCheckinDateTime(actualOpenDate.toISOString()) : "";

  app.innerHTML = `
    <div class="panel" style="text-align:center; padding: 32px 20px;">
      <div class="text-small" style="margin-bottom: 6px;">${activity.date}｜${activity.title}</div>
      <div style="font-size:0.9rem; color:var(--text-secondary); margin-bottom: 16px;">第 ${roundNumber} 次${round ? "｜" + checkinTypeLabel(round.checkinType) : ""}</div>
      <div style="font-size: 2.5rem; font-weight: 900; color: var(--teal); margin: 16px 0; background: #e0f2f1; padding: 12px; border-radius: var(--radius-md);">${bus} 車</div>
      
      <button class="btn btn-primary btn-block mt-4" id="checkinBtn" style="font-size:1.1rem; padding:16px;" ${notYetOpen ? "disabled" : ""}>
        ${notYetOpen ? `⏳ 尚未開放（${openTimeText} 開放）` : "🚀 立即上車登記"}
      </button>
      <button class="btn btn-ghost btn-block mt-2" id="onWayBtn">🚶 我在路上</button>
      <div id="onWayOptions" style="display:none; gap:8px; margin-top:8px;">
        <button class="btn btn-ghost delayBtn" data-min="3" style="flex:1;">晚到 3 分</button>
        <button class="btn btn-ghost delayBtn" data-min="5" style="flex:1;">晚到 5 分</button>
        <button class="btn btn-ghost delayBtn" data-min="10" style="flex:1;">晚到 10 分</button>
      </div>
      <p id="checkinResult" style="margin-top:16px;"></p>
    </div>
  `;

  if(notYetOpen){
    const waitMs = actualOpenDate.getTime() - Date.now();
    setTimeout(()=>{
      const btn = document.getElementById("checkinBtn");
      if(btn){ btn.disabled = false; btn.textContent = "🚀 立即上車登記"; }
    }, Math.max(0, waitMs));
  }

  document.getElementById("checkinBtn").addEventListener("click", ()=>{
    const btn = document.getElementById("checkinBtn");
    if(btn.disabled) return;
    btn.disabled = true;
    document.getElementById("onWayBtn").disabled = true;
    document.getElementById("checkinResult").innerHTML = `<span style="color:var(--teal); font-weight:700; font-size:1.1rem;">✅ 報到調查登記完成！一路順風</span>`;
    submitCheckinWithRetry(activityId, roundNumber, bus, profile.userId, profile.displayName);
  });

  const onWayBtn = document.getElementById("onWayBtn");
  const onWayOptions = document.getElementById("onWayOptions");
  onWayBtn.addEventListener("click", ()=>{
    onWayOptions.style.display = onWayOptions.style.display === "none" ? "flex" : "none";
  });
  document.querySelectorAll(".delayBtn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const mins = btn.dataset.min;
      onWayOptions.style.display = "none";
      document.getElementById("checkinResult").innerHTML = `<span style="color:#e08a00; font-weight:700;">🚶 已回報晚到約 ${mins} 分鐘</span>`;
      try{
        await apiSubmitDelay({ activityId, roundNumber, busLabel: bus, userId: profile.userId, displayName: profile.displayName, delayMinutes: mins });
      }catch(e){
        console.warn("回報晚到失敗", e);
      }
    });
  });
}

/* ---- view=checkinStatus：登記情形 ---- */
async function renderCheckinStatus(){
  const app = document.getElementById("app");
  const roundNumber = params.get("round");
  if(!roundNumber){
    app.innerHTML = `<div class="empty">❌ 缺少報到調查次別參數</div>`;
    return;
  }
  const { status } = await checkIsManager(profile.userId);
  if(status !== "approved"){
    app.innerHTML = `<div class="empty">🔒 此頁面僅限核准管理者使用</div>`;
    return;
  }
  app.innerHTML = `
    <div class="panel">
      <h3 class="panel-title">📋 報到調查登記情形：第 ${roundNumber} 次</h3>
      <div class="text-small" style="margin-bottom: 12px;">${activity.date}｜${activity.title}</div>
      <button class="btn btn-ghost btn-block" id="refreshStatusBtn">🔄 重新整理（強制向伺服器查詢最新）</button>
      <div id="statusBody" style="margin-top:14px;"></div>
    </div>
  `;

  function paintStatus(data, opts){
    const body = document.getElementById("statusBody");
    if(!data || !data.total){
      body.innerHTML = `<div class="empty" style="border:none;">目前還沒有人登記</div>`;
    }else{
      const delaysHtml = (data.delays && data.delays.length)
        ? `<div class="waitlist-activity-section" style="border-color:#e08a00;">
             <p class="waitlist-activity-title" style="background:#fff3e0;">🚶 我在路上（${data.delays.length} 人）</p>
             ${data.delays.map(p => `
               <div class="waitlist-row">
                 <div>
                   <div class="name">${p.displayName || "(未提供名稱)"}</div>
                   <div class="meta">晚到約 ${p.delayMinutes} 分鐘｜回報時間：${p.createdAt}</div>
                 </div>
               </div>
             `).join("")}
           </div>`
        : "";
      body.innerHTML = `<div style="font-weight:700; margin-bottom:10px; font-size: 0.9rem; color: var(--text-secondary);">共 ${data.total} 人已完成報到調查</div>` +
        Object.keys(data.byBus).sort().map(bus => `
          <div class="waitlist-activity-section">
            <p class="waitlist-activity-title">🚌 ${bus} 車（${data.byBus[bus].length} 人）</p>
            ${data.byBus[bus].map(p => `
              <div class="waitlist-row">
                <div>
                  <div class="name">${p.displayName || "(未提供名稱)"}</div>
                  <div class="meta">報到調查時間：${p.createdAt}</div>
                </div>
              </div>
            `).join("")}
          </div>
        `).join("") + delaysHtml;
    }
    if(opts && opts.fromCache){
      body.insertAdjacentHTML("afterbegin", `<p style="font-size:0.75rem;color:#999;margin-bottom:8px;">⚡ 這是 GitHub 上的快取資料，背景正在向伺服器確認最新狀態…</p>`);
    }
  }

  // 先讀 GitHub 的快照（純靜態檔案，沒有 GAS 冷啟動），能秒開先讓管理者看到大致狀況；
  // 不管有沒有讀到快照，都會接著打 GAS 拿真正最新的資料再覆蓋畫面一次
  async function loadStatus(forceOnly){
    const body = document.getElementById("statusBody");
    if(!forceOnly){
      const cached = await fetchCheckinStatusFile(activityId, roundNumber);
      if(cached){
        paintStatus(cached, { fromCache: true });
      }else{
        body.innerHTML = `<div class="welcome-loader" style="padding: 20px;"><div class="spinner-pulse"></div></div>`;
      }
    }else{
      body.innerHTML = `<div class="welcome-loader" style="padding: 20px;"><div class="spinner-pulse"></div></div>`;
    }
    try{
      const data = await apiGetCheckinStatus(profile.userId, activityId, roundNumber);
      paintStatus(data);
    }catch(e){
      if(forceOnly || !document.querySelector(".waitlist-activity-section")){
        body.innerHTML = `<div class="empty" style="border:none; color:var(--stamp);">讀取失敗：${e.message}</div>`;
      }
    }
  }
  document.getElementById("refreshStatusBtn").addEventListener("click", ()=> loadStatus(true));
  loadStatus(false);
}

async function main(){
  if(!activityId){
    document.getElementById("app").innerHTML = `<div class="empty">❌ 缺少活動 ID</div>`;
    return;
  }
  try{
    profile = await requireLogin();
  }catch(e){
    document.getElementById("app").innerHTML = `<div class="empty">🔒 請先登入 LINE 才能使用這個功能</div>`;
    return;
  }
  try{
    activity = await getActivityById(activityId);
    if(!activity){
      document.getElementById("app").innerHTML = `<div class="empty">❌ 找不到這個活動</div>`;
      return;
    }
    const titleMap = {
      payAdmin: "匯款通知管理", payForm: "已支付登記", payInfo: "支付說明",
      checkinAdmin: "建立上車報到調查", checkin: "上車登記", checkinStatus: "報到調查情形",
    };
    document.getElementById("pageTitle").textContent = titleMap[view] || "支付登記";

    if(view === "payAdmin") await renderPayAdmin();
    else if(view === "payForm") await renderPayForm();
    else if(view === "checkinAdmin") await renderCheckinAdmin();
    else if(view === "checkin"){ await renderCheckin(); flushPendingCheckins(); }
    else if(view === "checkinStatus") await renderCheckinStatus();
    else renderPayInfo();
  }catch(e){
    document.getElementById("app").innerHTML = `<div class="empty">載入失敗：${e.message}</div>`;
  }
}

main();
</script>
