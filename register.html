<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>支付登記</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #00B900; /* LINE Green */
        --primary-dark: #009900;
        --teal: #14b8a6;
        --teal-hover: #0d9488;
        --bg: #f6f7f9;
        --panel-bg: #ffffff;
        --text-main: #333333;
        --text-secondary: #777777;
        --border: #e0e0e0;
        --stamp: #ff5722; /* 警示色 */
        --radius-md: 12px;
        --radius-sm: 8px;
        --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        margin: 0;
        padding: 0;
        line-height: 1.5;
        padding-bottom: 80px; /* 防止內容被底部遮擋 */
    }

    /* Topbar 美化 */
    .topbar {
        background-color: var(--panel-bg);
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .topbar-compact {
        padding: 12px 20px;
    }

    .eyebrow {
        font-size: 0.75rem;
        color: var(--primary);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: block;
        margin-bottom: 2px;
    }

    h1 {
        margin: 0;
        font-size: 1.25rem !important;
        font-weight: 800;
    }

    /* 主要內容區域 */
    .admin-wrap {
        max-width: 600px;
        margin: 20px auto;
        padding: 0 16px;
    }

    /* 通用 Panel 卡片 */
    .panel {
        background-color: var(--panel-bg);
        border-radius: var(--radius-md);
        padding: 24px;
        box-shadow: var(--shadow);
        margin-bottom: 20px;
        border: 1px solid rgba(0,0,0,0.02);
    }

    .panel-title {
        font-size: 1.1rem;
        font-weight: 700;
        margin: 0 0 12px 0;
        color: var(--text-main);
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
    }

    /* 文字樣式 */
    .text-small { font-size: 0.85rem; color: var(--text-secondary); }
    .text-bold { font-weight: 700; }
    .text-highlight { color: var(--primary); font-weight: 700; }
    
    /* 活動標頭資訊 */
    .activity-header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        padding: 20px;
        border-radius: var(--radius-md);
        margin-bottom: 20px;
    }
    .activity-header .eyebrow { color: rgba(255,255,255,0.8); }
    .activity-header .panel-title { border-bottom: 1px solid rgba(255,255,255,0.3); color: white; }

    /* 表單欄位 */
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }

    .field-label {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-main);
    }

    input[type="text"],
    input[type="number"],
    select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-family: inherit;
        font-size: 1rem;
        background-color: #fff;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(0, 185, 0, 0.1);
    }

    /* 特殊欄位：複製銀行帳號 */
    .copy-field {
        display: flex;
        align-items: center;
        gap: 8px;
        background-color: #f9f9f9;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 4px 4px 4px 16px;
    }

    .copy-text {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 1rem;
        color: #333;
        letter-spacing: 0.5px;
        flex-grow: 1;
        user-select: all;
    }

    /* 按鈕樣式 */
    .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        padding: 12px 24px;
        border-radius: var(--radius-sm);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        text-decoration: none;
        font-family: inherit;
        line-height: 1.4;
    }

    .btn-block { display: flex; width: 100%; }

    /* 主要按鈕 (綠色) */
    .btn-primary {
        background-color: var(--primary);
        color: white;
    }
    .btn-primary:hover { background-color: var(--primary-dark); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { background-color: #ccc; cursor: not-allowed; }

    /* 幽靈按鈕 (邊框) */
    .btn-ghost {
        background-color: transparent;
        border: 1px solid var(--border);
        color: var(--text-secondary);
    }
    .btn-ghost:hover { background-color: #f5f5f5; border-color: #ccc; }

    /* 青色按鈕 (LINE Pay) */
    .btn-teal {
        background-color: var(--teal);
        color: white;
    }
    .btn-teal:hover { background-color: var(--teal-hover); }

    /* 通知文字 */
    .notice-box {
        background-color: #fff3e0;
        border-left: 4px solid var(--stamp);
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        color: #827717;
        font-size: 0.85rem;
        margin-top: 16px;
    }

    /* 載入中與空狀態 */
    .spinner-wrap {
        display: flex;
        justify-content: center;
        padding: 40px 0;
    }
    .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid var(--primary);
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .empty, .error-state {
        text-align: center;
        color: var(--text-secondary);
        padding: 40px 20px;
        font-size: 0.9rem;
        background: white;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
    }

    /* 管理員列表行 */
    .waitlist-row {
        background: #fff;
        border-bottom: 1px solid #eee;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .waitlist-row:first-child { border-top-left-radius: var(--radius-sm); border-top-right-radius: var(--radius-sm); }
    .waitlist-row:last-child { border-bottom-left-radius: var(--radius-sm); border-bottom-right-radius: var(--radius-sm); border-bottom: none; }
    .waitlist-row:hover { background-color: #fafafa; }
    
    .waitlist-row .name { font-weight: 700; font-size: 0.95rem; }
    .waitlist-row .meta { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
    .waitlist-row .method-tag {
        font-size: 0.75rem; padding: 2px 6px; border-radius: 4px;
        background: #eee; color: #666; margin-left: 8px;
    }

    /* 成功頁面圖示 */
    .success-icon { font-size: 4rem; margin-bottom: 16px; display: block; text-align: center; }

    /* 調整間距 */
    .gap-sm { gap: 8px; }
    .gap-md { gap: 16px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
    .mt-5 { margin-top: 24px; }

    /* 管理員專區區塊 */
    .admin-section {
        border: 2px dashed #ffcc80;
        background-color: #fff8e1;
        padding: 16px;
        border-radius: var(--radius-md);
        margin-top: 20px;
    }

</style>
</head>
<body>

<div class="topbar topbar-compact">
  <div>
    <span class="eyebrow">Payment</span>
    <h1 id="pageTitle">支付登記</h1>
  </div>
</div>

<div class="admin-wrap" id="app">
  <div class="spinner-wrap"><div class="spinner"></div></div>
</div>

    () => showToast("已複製：" + text),
    () => prompt("請手動複製：", text)
  );
}

    // 簡單實作，或者可以使用現有的 alert
