<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>支付登記</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #00B900; /* LINE Green */
        --primary-dark: #009900;
        --teal: #14b8a6;
        --teal-hover: #0d9488;
        --bg: #f6f7f9;
        --panel-bg: #ffffff;
        --text-main: #333333;
        --text-secondary: #777777;
        --border: #e0e0e0;
        --stamp: #ff5722; /* 警示色 */
        --radius-md: 12px;
        --radius-sm: 8px;
        --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        margin: 0;
        padding: 0;
        line-height: 1.5;
        padding-bottom: 80px; /* 防止內容被底部遮擋 */
    }

    /* Topbar 美化 */
    .topbar {
        background-color: var(--panel-bg);
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .topbar-compact {
        padding: 12px 20px;
    }

    .eyebrow {
        font-size: 0.75rem;
        color: var(--primary);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: block;
        margin-bottom: 2px;
    }

    h1 {
        margin: 0;
        font-size: 1.25rem !important;
        font-weight: 800;
    }

    /* 主要內容區域 */
    .admin-wrap {
        max-width: 600px;
        margin: 20px auto;
        padding: 0 16px;
    }

    /* 通用 Panel 卡片 */
    .panel {
        background-color: var(--panel-bg);
        border-radius: var(--radius-md);
        padding: 24px;
        box-shadow: var(--shadow);
        margin-bottom: 20px;
        border: 1px solid rgba(0,0,0,0.02);
    }

    .panel-title {
        font-size: 1.1rem;
        font-weight: 700;
        margin: 0 0 12px 0;
        color: var(--text-main);
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
    }

    /* 文字樣式 */
    .text-small { font-size: 0.85rem; color: var(--text-secondary); }
    .text-bold { font-weight: 700; }
    .text-highlight { color: var(--primary); font-weight: 700; }
    
    /* 活動標頭資訊 */
    .activity-header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        padding: 20px;
        border-radius: var(--radius-md);
        margin-bottom: 20px;
    }
    .activity-header .eyebrow { color: rgba(255,255,255,0.8); }
    .activity-header .panel-title { border-bottom: 1px solid rgba(255,255,255,0.3); color: white; }

    /* 表單欄位 */
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }

    .field-label {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-main);
    }

    input[type="text"],
    input[type="number"],
    select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-family: inherit;
        font-size: 1rem;
        background-color: #fff;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(0, 185, 0, 0.1);
    }

    /* 特殊欄位：複製銀行帳號 */
    .copy-field {
        display: flex;
        align-items: center;
        gap: 8px;
        background-color: #f9f9f9;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 4px 4px 4px 16px;
    }

    .copy-text {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 1rem;
        color: #333;
        letter-spacing: 0.5px;
        flex-grow: 1;
        user-select: all;
    }

    /* 按鈕樣式 */
    .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        padding: 12px 24px;
        border-radius: var(--radius-sm);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        text-decoration: none;
        font-family: inherit;
        line-height: 1.4;
    }

    .btn-block { display: flex; width: 100%; }

    /* 主要按鈕 (綠色) */
    .btn-primary {
        background-color: var(--primary);
        color: white;
    }
    .btn-primary:hover { background-color: var(--primary-dark); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { background-color: #ccc; cursor: not-allowed; }

    /* 幽靈按鈕 (邊框) */
    .btn-ghost {
        background-color: transparent;
        border: 1px solid var(--border);
        color: var(--text-secondary);
    }
    .btn-ghost:hover { background-color: #f5f5f5; border-color: #ccc; }

    /* 青色按鈕 (LINE Pay) */
    .btn-teal {
        background-color: var(--teal);
        color: white;
    }
    .btn-teal:hover { background-color: var(--teal-hover); }

    /* 通知文字 */
    .notice-box {
        background-color: #fff3e0;
        border-left: 4px solid var(--stamp);
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        color: #827717;
        font-size: 0.85rem;
        margin-top: 16px;
    }

    /* 載入中與空狀態 */
    .spinner-wrap {
        display: flex;
        justify-content: center;
        padding: 40px 0;
    }
    .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid var(--primary);
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .empty, .error-state {
        text-align: center;
        color: var(--text-secondary);
        padding: 40px 20px;
        font-size: 0.9rem;
        background: white;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
    }

    /* 管理員列表行 */
    .waitlist-row {
        background: #fff;
        border-bottom: 1px solid #eee;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .waitlist-row:first-child { border-top-left-radius: var(--radius-sm); border-top-right-radius: var(--radius-sm); }
    .waitlist-row:last-child { border-bottom-left-radius: var(--radius-sm); border-bottom-right-radius: var(--radius-sm); border-bottom: none; }
    .waitlist-row:hover { background-color: #fafafa; }
    
    .waitlist-row .name { font-weight: 700; font-size: 0.95rem; }
    .waitlist-row .meta { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
    .waitlist-row .method-tag {
        font-size: 0.75rem; padding: 2px 6px; border-radius: 4px;
        background: #eee; color: #666; margin-left: 8px;
    }

    /* 成功頁面圖示 */
    .success-icon { font-size: 4rem; margin-bottom: 16px; display: block; text-align: center; }

    /* 調整間距 */
    .gap-sm { gap: 8px; }
    .gap-md { gap: 16px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
    .mt-5 { margin-top: 24px; }

    /* 管理員專區區塊 */
    .admin-section {
        border: 2px dashed #ffcc80;
        background-color: #fff8e1;
        padding: 16px;
        border-radius: var(--radius-md);
        margin-top: 20px;
    }

</style>
</head>
<body>

<div class="topbar topbar-compact">
  <div>
    <span class="eyebrow">Payment</span>
    <h1 id="pageTitle">支付登記</h1>
  </div>
</div>

<div class="admin-wrap" id="app">
  <div class="spinner-wrap"><div class="spinner"></div></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<!-- 假設您的 main.js 包含 API 邏輯，這裡維持原樣引用 -->
<script src="assets/main.js?v=20260728-12"></script>
<script>
// --- 原有的 JS 邏輯區域 (保持不變，僅修正 alert 樣式) ---
const params = getRealQueryParams();
const activityId = params.get("activityId");
const view = params.get("view") || "payInfo";
let activity = null;
let profile = null;

function methodLabel(m){
  return { transfer: "轉帳匯款", linepay: "LINE Pay", cash: "現金" }[m] || m;
}

// 美化複製提示
function copyText(text){
  navigator.clipboard?.writeText(text).then(
    () => showToast("已複製：" + text),
    () => prompt("請手動複製：", text)
  );
}

// 簡易 Toast 提示 (選用，如果需要更漂亮的提示)
function showToast(msg) {
    // 簡單實作，或者可以使用現有的 alert
    alert(msg);
}

/* ---- view=payInfo：支付說明 ---- */
function renderPayInfo(){
  const app = document.getElementById("app");
  
  const bank = activity.bankInfo
    ? `<div class="field mt-3">
         <div class="copy-field">
           <span class="copy-text" id="bankInfoVal">${activity.bankInfo}</span>
           <button type="button" class="btn btn-ghost" id="copyBankBtn" style="padding: 8px 12px;">📋 複製</button>
         </div>
         <div class="notice-box mt-2">
           ⭐ 匯款後請記得點下方按鈕進行「已支付登記」並填寫帳號末四碼。
         </div>
       </div>`
    : `<div class="text-small" style="color:#999;">主辦人尚未設定匯款帳號。</div>`;

  const linepay = activity.organizerLineUrl
    ? `<div class="field">
         <a class="btn btn-teal btn-block" href="${activity.organizerLineUrl}" target="_blank" rel="noopener">
           <span style="font-weight:900; margin-right:8px;">LINE Pay</span> 前往轉帳
         </a>
         <p class="text-small mt-2" style="text-align:center;">請先加主辦人 LINE 好友，再進行轉帳</p>
       </div>`
    : `<p class="text-small" style="color:#999;">主辦人尚未設定 LINE Pay 連結。</p>`;

  app.innerHTML = `
    <div class="activity-header">
        <span class="eyebrow">${activity.date}</span>
        <h2 class="panel-title" style="border:none; padding:0; margin-top:4px;">${activity.title}</h2>
        <p style="font-size:1.25rem; font-weight:900; margin:12px 0 0 0;">應付費用：NT$ ${activity.price || "-"}</p>
    </div>

    <div class="panel">
      <h3 class="panel-title" style="display:flex; align-items:center; gap:6px;">
        <span>💳</span> 請選擇以下<strong>其中一種方式</strong>完成付款
      </h3>
      <p class="text-small" style="color:var(--text-secondary); margin-bottom: 20px;">完成付款後，別忘了點擊下方按鈕回報登記。</p>

      <!-- 方式一：轉帳匯款 -->
      <div style="border: 2px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 16px; background: #fafafa;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-weight: 700; color: var(--text-main); font-size: 1rem;">選項 A：轉帳匯款</span>
          <span style="font-size: 0.75rem; background: #e0e0e0; padding: 2px 8px; border-radius: 10px;">ATM / 網銀</span>
        </div>
        <div class="text-small" style="margin-bottom: 6px;">匯款銀行與帳號：</div>
        ${bank}
      </div>

      <!-- 分隔提示 -->
      <div style="text-align: center; margin: 12px 0; position: relative;">
        <span style="background: white; padding: 0 12px; font-size: 0.85rem; color: #999; position: relative; z-index: 1;">或者</span>
        <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border); z-index: 0;"></div>
      </div>

      <!-- 方式二：LINE Pay -->
      <div style="border: 2px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-top: 16px; background: #fafafa;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <span style="font-weight: 700; color: var(--text-main); font-size: 1rem;">選項 B：LINE Pay 轉帳</span>
          <span style="font-size: 0.75rem; background: #e0f2f1; color: var(--teal); padding: 2px 8px; border-radius: 10px;">線上支付</span>
        </div>
        ${linepay}
      </div>
    </div>

    <!-- 底部動作按鈕 -->
    <div class="panel" style="background: transparent; box-shadow: none; border: none; padding: 0; margin-top: 20px;">
      <a class="btn btn-primary btn-block" id="goFormBtn" style="margin-bottom: 12px; padding: 14px; font-size: 1.1rem;">✏️ 我已完成付款，前往登記</a>
      <a class="btn btn-ghost btn-block" id="goDetailBtn">📄 返回活動詳情</a>
    </div>
  `;

  if(activity.bankInfo){
    document.getElementById("copyBankBtn").addEventListener("click", ()=> copyText(activity.bankInfo));
  }
  document.getElementById("goFormBtn").addEventListener("click", ()=>{
    location.href = `register.html?activityId=${encodeURIComponent(activityId)}&view=payForm`;
  });
  document.getElementById("goDetailBtn").addEventListener("click", ()=>{
    location.href = `detail.html?id=${encodeURIComponent(activityId)}`;
  });
}

/* ---- view=payForm：已支付登記表單 ---- */
async function renderPayForm(){
  const app = document.getElementById("app");
  let existing = null;
  try{ existing = await apiGetMyPayment(activityId, profile.userId); }catch(e){ console.warn(e); }

  app.innerHTML = `
    <div class="activity-header">
        <span class="eyebrow">Payment Form</span>
        <h2 class="panel-title" style="border:none; padding:0; margin-top:4px;">已支付登記</h2>
    </div>

    <div class="panel">
      <div class="text-small" style="margin-bottom: 16px;">活動：${activity.date}｜${activity.title}</div>

      <div class="field">
        <label class="field-label">請選擇支付方式</label>
        <select id="method">
          <option value="transfer">轉帳匯款</option>
          <option value="linepay">LINE Pay</option>
          <option value="cash">現金</option>
        </select>
      </div>
      <div class="field" id="last4Field">
        <label class="field-label">轉帳（匯款）銀行帳號末 4 碼</label>
        <input type="text" id="last4" maxlength="4" inputmode="numeric" placeholder="例如 1234">
      </div>
      <div class="field">
        <label class="field-label">匯款人姓名</label>
        <input type="text" id="payerName" value="${profile.displayName || ""}">
      </div>

      <button class="btn btn-primary btn-block mt-4" id="submitBtn">送出登記</button>
      <p id="msg" class="text-small mt-2" style="text-align:center; color:var(--stamp);"></p>
    </div>
  `;

  const methodSel = document.getElementById("method");
  const last4Field = document.getElementById("last4Field");
  function syncLast4Visibility(){
    last4Field.style.display = methodSel.value === "transfer" ? "block" : "none";
  }
  methodSel.addEventListener("change", syncLast4Visibility);
  syncLast4Visibility();

  if(existing){
    methodSel.value = existing.method || "transfer";
    document.getElementById("last4").value = existing.last4 || "";
    document.getElementById("payerName").value = existing.displayName || profile.displayName || "";
    syncLast4Visibility();
    document.getElementById("msg").textContent = `💡 您於 (${existing.updatedAt}) 登記過，重新送出將會覆蓋更新。`;
  }

  document.getElementById("submitBtn").addEventListener("click", async ()=>{
    const method = methodSel.value;
    const last4 = document.getElementById("last4").value.trim();
    const payerName = document.getElementById("payerName").value.trim();
    if(method === "transfer" && !/^\d{4}$/.test(last4)){
      alert("請輸入正確的銀行帳號末 4 碼（4 位數字）");
      return;
    }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "送出中…";
    try{
      await apiSubmitPayment(activityId, profile.userId, payerName, method, method === "transfer" ? last4 : "");
      app.innerHTML = `
        <div class="panel" style="text-align:center; padding: 40px 24px;">
          <span class="success-icon">✅</span>
          <h3 style="margin: 0 0 8px 0; font-size: 1.25rem;">登記完成</h3>
          <p class="text-small" style="margin-bottom: 24px;">${activity.title}｜${methodLabel(method)}</p>
          <a class="btn btn-ghost btn-block" href="detail.html?id=${encodeURIComponent(activityId)}">返回活動詳情</a>
        </div>
      `;
    }catch(e){
      alert("送出失敗：" + e.message);
      btn.disabled = false;
      btn.textContent = "送出登記";
    }
  });
}

/* ---- view=payAdmin：管理端，發通知＋看名單 ---- */
async function renderPayAdmin(){
  const app = document.getElementById("app");
  const { status } = await checkIsManager(profile.userId);
  if(status !== "approved"){
    app.innerHTML = `<div class="empty">🔒 此頁面僅限核准管理者使用</div>`;
    return;
  }
  app.innerHTML = `
    <div class="panel">
      <h3 class="panel-title">🛡️ 匯款通知／支付登記管理</h3>
      <div class="text-small" style="margin-bottom: 12px;">${activity.date}｜${activity.title}｜費用 NT$ ${activity.price || "-"}</div>
      
      ${activity.bankInfo ? "" : `<div class="notice-box">⚠️ 這個活動還沒設定匯款帳號（請至「編輯活動」補上），通知內將只會顯示 LINE Pay 選項。</div>`}
      
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
        <button class="btn btn-primary btn-block" id="sendBtn">📣 發送匯款通知到群組</button>
        <button class="btn btn-ghost btn-block" id="refreshBtn">🔄 重新整理名單</button>
      </div>
      
      <div id="list" style="margin-top:20px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow:hidden;"></div>
    </div>
  `;
  document.getElementById("sendBtn").addEventListener("click", ()=> sharePaymentNotice(activity));
  document.getElementById("refreshBtn").addEventListener("click", loadPaymentList);
  loadPaymentList();
}

async function loadPaymentList(){
  const listEl = document.getElementById("list");
  listEl.innerHTML = `<div class="spinner-wrap"><div class="spinner"></div></div>`;
  try{
    const list = await apiGetPayments(profile.userId, activityId);
    if(!list.length){
      listEl.innerHTML = `<div class="empty" style="border:none;">目前還沒有人登記支付</div>`;
      return;
    }
    listEl.innerHTML = `<div style="background: #f9f9f9; padding: 8px 16px; font-size: 0.8rem; color: var(--text-secondary); border-bottom: 1px solid var(--border);">共 ${list.length} 人已登記</div>` + list.map(p => `
      <div class="waitlist-row">
        <div>
          <div class="name">${p.displayName || "(未提供名稱)"}</div>
          <div class="meta">${methodLabel(p.method)}${p.last4 ? "／末 4 碼 <span style='font-family:monospace; font-weight:bold; color:#333;'>" + p.last4 + "</span>" : ""}｜${p.updatedAt}</div>
        </div>
      </div>
    `).join("");
  }catch(e){
    listEl.innerHTML = `<div class="empty" style="border:none; color:var(--stamp);">讀取失敗：${e.message}</div>`;
  }
}

async function main(){
  if(!activityId){
    document.getElementById("app").innerHTML = `<div class="empty">❌ 缺少活動 ID</div>`;
    return;
  }
  try{
    profile = await requireLogin();
  }catch(e){
    document.getElementById("app").innerHTML = `<div class="empty">🔒 請先登入 LINE 才能使用這個功能</div>`;
    return;
  }
  try{
    activity = await getActivityById(activityId);
    if(!activity){
      document.getElementById("app").innerHTML = `<div class="empty">找不到這個活動</div>`;
      return;
    }
    document.getElementById("pageTitle").textContent =
      view === "payAdmin" ? "匯款通知管理" : view === "payForm" ? "已支付登記" : "支付說明";

    if(view === "payAdmin") await renderPayAdmin();
    else if(view === "payForm") await renderPayForm();
    else renderPayInfo();
  }catch(e){
    document.getElementById("app").innerHTML = `<div class="empty">載入失敗：${e.message}</div>`;
  }
}

main();
</script>
</body>
</html>
