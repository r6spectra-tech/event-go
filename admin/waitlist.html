<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>候補名單管理</title>
<link rel="stylesheet" href="../assets/style.css?v=20260728-27">
</head>
<body>

<div class="topbar">
  <div>
    <span class="eyebrow">Organizer Only</span>
    <h1>候補名單管理</h1>
  </div>
</div>

<div class="admin-wrap">
  <div class="nav-links">
    <a class="btn btn-ghost" href="../index.html">← 回列表頁</a>
    <a class="btn btn-ghost" id="backToDetailLink" style="display:none;" href="#">回本活動詳情頁 →</a>
  </div>
  <div id="app"><div class="spinner-wrap"><div class="spinner"></div></div></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="../assets/main.js?v=20260728-27"></script>
<script>
const statusLabel = { waiting:"排隊中", notified:"已通知，等待回覆", joined:"已加入", cancelled:"已取消", expired:"已逾期（24hr 未回覆）" };
let currentProfile = null;
let allActivities = [];

function isExpired(eventDate){
  if(!eventDate) return false;
  const d = new Date(eventDate);
  if(isNaN(d)) return false;
  const today = new Date();
  today.setHours(0,0,0,0);
  return d < today;
}

function rowHtml(entry){
  const canNotify = entry.status === "waiting" || entry.status === "notified" || entry.status === "expired";
  const metaLines = [`userId: ${entry.userId.slice(0,10)}…`, `排隊時間: ${entry.createdAt}`];
  if(entry.notifiedAt) metaLines.push(`通知時間: ${entry.notifiedAt}`);
  if(entry.respondedAt) metaLines.push(`回覆時間: ${entry.respondedAt}`);
  return `
  <div class="waitlist-row">
    <div>
      <div class="name">${entry.displayName || "(未提供名稱)"}</div>
      <div class="meta">${metaLines.map(l=>`<div>${l}</div>`).join("")}</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="badge ${entry.status}">${statusLabel[entry.status] || entry.status}</span>
      ${canNotify ? `<button class="btn btn-teal notifyBtn" data-user="${entry.userId}" data-activity="${entry.activityId}">傳 LINE 通知</button>` : ""}
    </div>
  </div>`;
}

async function loadActivityOptions(preselectId){
  const select = document.getElementById("activitySelect");
  try{
    allActivities = await fetchActivities();
    let list = allActivities.filter(a => !isExpired(a.eventDate));
    // 如果是從活動詳情頁的候補連結帶 id 過來，就算該活動已過期也要能選到
    if(preselectId && !list.some(a => a.id === preselectId)){
      const found = allActivities.find(a => a.id === preselectId);
      if(found) list = [found, ...list];
    }
    if(!list.length){
      select.innerHTML = `<option value="">（沒有未過期的活動）</option>`;
      return;
    }
    select.innerHTML = `<option value="">請選擇活動…</option>` +
      list.map(a => `<option value="${a.id}">${a.id} - ${a.title}（${a.date}）</option>`).join("");
    if(preselectId){
      select.value = preselectId;
      onActivityChange(preselectId);
    }
  }catch(e){
    select.innerHTML = `<option value="">活動列表載入失敗</option>`;
  }
}

function onActivityChange(activityId){
  const backLink = document.getElementById("backToDetailLink");
  if(activityId){
    backLink.href = `../detail.html?id=${encodeURIComponent(activityId)}`;
    backLink.style.display = "inline-block";
  }else{
    backLink.style.display = "none";
  }
  loadWaitlist(activityId);
}

async function loadWaitlist(activityId){
  const listEl = document.getElementById("list");
  if(!activityId){ listEl.innerHTML = ""; return; }
  listEl.innerHTML = `<div class="spinner-wrap"><div class="spinner"></div></div>`;
  try{
    const entries = await adminGetWaitlist(activityId, currentProfile.userId);
    if(!entries.length){
      listEl.innerHTML = `<div class="empty">目前沒有候補名單</div>`;
      return;
    }
    listEl.innerHTML = entries.map(rowHtml).join("");
    listEl.querySelectorAll(".notifyBtn").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        btn.disabled = true; btn.textContent = "通知中…";
        try{
          await adminNotify(activityId, btn.dataset.user, currentProfile.userId);
          btn.textContent = "已送出通知";
          loadWaitlist(activityId);
        }catch(e){
          alert("通知失敗：" + e.message);
          btn.disabled = false; btn.textContent = "傳 LINE 通知";
        }
      });
    });
  }catch(e){
    console.error(e);
    listEl.innerHTML = `<div class="empty">讀取失敗：${e.message}</div>`;
  }
}

// 依活動分區顯示「所有」候補名單（沒有指定 id 時用這個，例如從 index.html 的候補管理入口進來）
async function loadAllWaitlist(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="panel">
      <p class="panel-title">候補名單（全部活動）</p>
      <div id="allList"><div class="spinner-wrap"><div class="spinner"></div></div></div>
    </div>
  `;
  const listEl = document.getElementById("allList");
  try{
    const [entries, activities] = await Promise.all([
      adminGetAllWaitlist(currentProfile.userId),
      fetchActivities(),
    ]);
    if(!entries.length){
      listEl.innerHTML = `<div class="empty">目前所有活動都沒有候補名單</div>`;
      return;
    }
    const activityMap = {};
    activities.forEach(a => { activityMap[a.id] = a; });

    const byActivity = {};
    entries.forEach(e => {
      byActivity[e.activityId] = byActivity[e.activityId] || [];
      byActivity[e.activityId].push(e);
    });

    // 有候補的活動排在前面，依活動日期排序（沒抓到活動資料的排最後）
    const activityIds = Object.keys(byActivity).sort((idA, idB) => {
      const a = activityMap[idA], b = activityMap[idB];
      const da = a && a.eventDate ? new Date(a.eventDate).getTime() : Infinity;
      const db = b && b.eventDate ? new Date(b.eventDate).getTime() : Infinity;
      return da - db;
    });

    listEl.innerHTML = activityIds.map(aid => {
      const act = activityMap[aid];
      const title = act ? `${act.date}｜${act.title}` : `（找不到活動資料，activityId: ${aid}）`;
      const rows = byActivity[aid].map(rowHtml).join("");
      return `
        <div class="waitlist-activity-section">
          <p class="waitlist-activity-title">
            ${title}
            ${act ? `<a href="../detail.html?id=${encodeURIComponent(aid)}" class="btn btn-ghost" style="font-size:0.7rem;padding:4px 8px;">查看活動 →</a>` : ""}
          </p>
          ${rows}
        </div>
      `;
    }).join("");

    wireNotifyButtons(listEl, (activityId) => byActivity[activityId] ? loadAllWaitlist() : null);
  }catch(e){
    listEl.innerHTML = `<div class="empty">讀取失敗：${e.message}</div>`;
  }
}

function wireNotifyButtons(container, onDone){
  container.querySelectorAll(".notifyBtn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const activityId = btn.dataset.activity;
      btn.disabled = true; btn.textContent = "通知中…";
      try{
        await adminNotify(activityId, btn.dataset.user, currentProfile.userId);
        btn.textContent = "已送出通知";
        if(onDone) onDone(activityId);
      }catch(e){
        alert("通知失敗：" + e.message);
        btn.disabled = false; btn.textContent = "傳 LINE 通知";
      }
    });
  });
}

function renderContent(profile){
  currentProfile = profile;
  const preselectId = new URLSearchParams(location.search).get("id");

  if(!preselectId){
    // 沒有帶 id：顯示所有活動、依活動分區的候補總覽
    loadAllWaitlist();
    return;
  }

  // 有帶 id（從活動詳情頁的候補連結進來）：維持原本單一活動的下拉選單模式
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="panel">
      <p class="panel-title">選擇活動 <span class="tag">未過期</span></p>
      <div class="field">
        <select id="activitySelect"><option value="">載入中…</option></select>
      </div>
    </div>
    <div class="panel">
      <p class="panel-title">候補名單</p>
      <div id="list"><div class="empty">請先選擇上方活動</div></div>
    </div>
  `;
  const select = document.getElementById("activitySelect");
  loadActivityOptions(preselectId);
  select.addEventListener("change", ()=> onActivityChange(select.value));
}

guardManagerPage(document.getElementById("app"), renderContent);
</script>
</body>
</html>
