<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者審核</title>
<link rel="stylesheet" href="../assets/style.css?v=20260728-15">
</head>
<body>

<div class="topbar">
  <div>
    <span class="eyebrow">Managers Only</span>
    <h1>管理者審核</h1>
  </div>
</div>

<div class="admin-wrap" id="app">
  <div class="spinner-wrap"><div class="spinner"></div></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="../assets/main.js?v=20260728-15"></script>
<script>
const statusLabel = { pending:"待審核", approved:"已核准", rejected:"已拒絕" };
let currentProfile = null;

function rowHtml(m){
  const showActions = m.status === "pending";
  return `
  <div class="waitlist-row">
    <div>
      <div class="name">${m.displayName || "(未提供名稱)"}</div>
      <div class="meta">userId: ${m.userId.slice(0,12)}…｜申請時間: ${m.appliedAt}</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="badge ${m.status}">${statusLabel[m.status] || m.status}</span>
      ${showActions ? `
        <button class="btn btn-teal approveBtn" data-user="${m.userId}">批准</button>
        <button class="btn btn-stamp rejectBtn" data-user="${m.userId}">拒絕</button>
      ` : ""}
      <button class="btn btn-ghost deleteBtn" data-user="${m.userId}" data-name="${m.displayName || m.userId}" title="刪除這筆紀錄" style="padding:6px 10px;color:var(--stamp);border-color:var(--stamp);">✕</button>
    </div>
  </div>`;
}

async function load(){
  const listEl = document.getElementById("list");
  listEl.innerHTML = `<div class="spinner-wrap"><div class="spinner"></div></div>`;
  try{
    const managers = await adminGetManagers(currentProfile.userId);
    if(!managers.length){
      listEl.innerHTML = `<div class="empty">目前沒有申請紀錄</div>`;
      return;
    }
    managers.sort((a,b)=> (a.status==="pending"?0:1) - (b.status==="pending"?0:1));
    listEl.innerHTML = managers.map(rowHtml).join("");

    listEl.querySelectorAll(".approveBtn").forEach(btn=>{
      btn.addEventListener("click", ()=> decide(btn.dataset.user, "approved"));
    });
    listEl.querySelectorAll(".rejectBtn").forEach(btn=>{
      btn.addEventListener("click", ()=> decide(btn.dataset.user, "rejected"));
    });
    listEl.querySelectorAll(".deleteBtn").forEach(btn=>{
      btn.addEventListener("click", ()=> remove(btn.dataset.user, btn.dataset.name));
    });
  }catch(e){
    console.error(e);
    listEl.innerHTML = `<div class="empty">讀取失敗：${e.message}</div>`;
  }
}

async function decide(userId, decision){
  try{
    await adminDecideManager(userId, decision, currentProfile.userId);
    load();
  }catch(e){
    alert("處理失敗：" + e.message);
  }
}

async function remove(userId, name){
  if(!confirm(`確定要刪除「${name}」的管理者紀錄嗎？這個動作無法復原，之後這個人要重新申請才能再拿到管理權限。`)) return;
  try{
    await adminDeleteManager(userId, currentProfile.userId);
    load();
  }catch(e){
    alert("刪除失敗：" + e.message);
  }
}

async function syncFile(){
  const btn = document.getElementById("syncBtn");
  btn.disabled = true;
  btn.textContent = "同步中…";
  try{
    await adminSyncManagersFile(currentProfile.userId);
    alert("已重新同步到 GitHub 的 data/managers.json");
  }catch(e){
    alert("同步失敗：" + e.message);
  }finally{
    btn.disabled = false;
    btn.textContent = "🔄 手動觸發同步";
  }
}

function renderContent(profile){
  currentProfile = profile;
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="panel">
      <p class="panel-title">管理者申請名單</p>
      <button class="btn btn-primary btn-block" id="loadBtn">重新整理</button>
      <button class="btn btn-ghost btn-block" id="syncBtn" style="margin-top:8px;">🔄 手動觸發同步</button>
      <p style="font-size:0.72rem;color:#999;margin:6px 0 0;">把目前名單重新寫進 GitHub 的 data/managers.json（平常不用按，申請/審核時會自動觸發，這顆是救急用的）</p>
      <div id="list" style="margin-top:16px;"></div>
    </div>
  `;
  document.getElementById("loadBtn").addEventListener("click", load);
  document.getElementById("syncBtn").addEventListener("click", syncFile);
  load();
}

guardManagerPage(document.getElementById("app"), renderContent);
</script>
</body>
</html>
