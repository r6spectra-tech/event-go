<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="page-version" content="20260726-14">
<title>機票時刻登記</title>
<link rel="stylesheet" href="../assets/style.css?v=20260726-14">
<link rel="stylesheet" href="flight.css?v=20260726-14">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div class="topbar">
    <div>
      <span class="f-eyebrow">機票時刻登記</span>
      <h1 id="f-activity-title"><span class="f-spinner-inline"></span></h1>
    </div>
  </div>

  <div class="f-wrap" id="f-app">
    <p class="f-sub" id="f-activity-sub"></p>

    <div id="f-init-loading" class="f-spinner-wrap"><div class="f-spinner"></div></div>

    <div id="f-login-gate" class="f-login-gate" hidden>
      <p>登入 LINE 後即可查看或填寫您的機票資訊。</p>
      <button class="btn primary" id="f-login-btn">登入 LINE 開始登記</button>
      <p style="margin-top:20px;"><a href="debug.html" style="font-size:0.75rem;color:#999;">疑難排解</a></p>
    </div>

    <div id="f-my" hidden>
      <div id="f-my-loading" class="f-spinner-wrap"><div class="f-spinner"></div></div>

      <div id="f-my-cards" hidden>
        <div class="f-card" id="f-card-go">
          <h3>去程（→ 澎湖）<span class="f-tag empty">尚未登記</span></h3>
          <div class="f-rows"></div>
          <div class="f-claim-info"></div>
          <div class="f-actions"></div>
          <div class="f-share-row"></div>
        </div>

        <div class="f-card" id="f-card-return">
          <h3>回程（澎湖 →）<span class="f-tag empty">尚未登記</span></h3>
          <div class="f-rows"></div>
          <div class="f-claim-info"></div>
          <div class="f-actions"></div>
          <div class="f-share-row"></div>
        </div>

        <div id="f-share-both"></div>

        <div id="f-claimed-cards"></div>

        <p class="f-sub">
          想看大家的登記狀況？<a href="overview.html" id="f-overview-link">查看總覽頁 →</a>
        </p>
        <p class="f-sub"><a href="admin.html" id="f-admin-link">主辦人管理入口 →</a></p>
      </div>
    </div>

    <div id="f-form-section" hidden>
      <h2 class="f-title" id="f-form-title"></h2>
      <div id="f-members"></div>
      <button type="button" class="f-add-member" id="f-add-member">＋ 新增同行成員</button>
      <div class="f-actions">
        <button type="button" class="btn" id="f-form-cancel">取消</button>
        <button type="button" class="btn primary" id="f-form-save">儲存</button>
      </div>
    </div>
  </div>

  <div class="f-version-tag">flight.js v20260726-14</div>

  <script src="../assets/main.js?v=20260726-14"></script>
  <script src="flight-data.js?v=20260726-14"></script>
  <script src="flight.js?v=20260726-14"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const link = document.getElementById("f-overview-link");
      link.href = `overview.html?activityId=${encodeURIComponent(getActivityId())}`;
      document.getElementById("f-admin-link").href = `admin.html?activityId=${encodeURIComponent(getActivityId())}`;
      initIndexPage();
    });
  </script>
</body>
</html>
