<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="page-version" content="20260728-7">
<title>機票登記總覽</title>
<link rel="stylesheet" href="../assets/style.css?v=20260728-7">
<link rel="stylesheet" href="flight.css?v=20260728-7">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div class="topbar">
    <div>
      <span class="f-eyebrow">機票登記總覽</span>
      <h1 id="f-activity-title"><span class="f-spinner-inline"></span></h1>
    </div>
  </div>

  <div class="f-wrap" id="f-app">
    <a href="#" id="f-back-link" class="btn ghost" style="margin-bottom:10px; display:inline-block;">← 回登記頁</a>

    <div class="f-cache-bar">
      <span id="f-ov-cache-time">本頁最後更新時間：尚未讀取</span>
      <span id="f-ov-cache-status" class="f-cache-status"></span>
      <button class="btn ghost" id="f-ov-refresh-btn">更新</button>
    </div>
    <p class="f-cache-note">為了減少伺服器負擔，登記頁有異動後，這個總表頁最快要等 5 分鐘才會反映最新資料，這是正常現象，不是系統故障。</p>

    <div class="f-dirbar">
      <button data-dir="go" class="active">去程（→ 澎湖）</button>
      <button data-dir="return">回程（澎湖 →）</button>
    </div>
    <div class="f-tabbar">
      <button data-tab="flight" class="active">依航班</button>
      <button data-tab="hour">依時段</button>
    </div>
    <div id="f-overview-body"><div class="f-spinner-wrap"><div class="f-spinner"></div></div></div>
  </div>

  <div class="f-version-tag">flight.js v20260728-7</div>

  <script src="../assets/main.js?v=20260728-7"></script>
  <script src="flight-data.js?v=20260728-7"></script>
  <script src="flight.js?v=20260728-7"></script>
  <script>
    document.addEventListener("DOMContentLoaded", initOverviewPage);
  </script>
</body>
</html>
