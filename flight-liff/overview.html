<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>機票登記總覽</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="flight.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div class="topbar">
    <div>
      <span class="f-eyebrow">機票登記總覽</span>
      <h1 id="f-activity-title"><span class="f-spinner-inline"></span></h1>
    </div>
  </div>

  <div class="f-wrap" id="f-app">
    <a href="#" id="f-back-link" class="btn ghost" style="margin-bottom:10px; display:inline-block;">← 回登記頁</a>
    <div class="f-dirbar">
      <button data-dir="go" class="active">去程（松山→澎湖）</button>
      <button data-dir="return">回程（澎湖→松山）</button>
    </div>
    <div class="f-tabbar">
      <button data-tab="flight" class="active">依航班</button>
      <button data-tab="hour">依時段</button>
    </div>
    <div class="f-date-caption" id="f-overview-date"></div>
    <div id="f-overview-body"><div class="f-spinner-wrap"><div class="f-spinner"></div></div></div>
  </div>

  <script src="../assets/main.js"></script>
  <script src="flight-data.js"></script>
  <script src="flight.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", initOverviewPage);
  </script>
</body>
</html>
